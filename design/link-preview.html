<!DOCTYPE html>
<!--
  Template of the 1200x630 link preview (og:image). scripts/link-preview.mjs fills
  window.PREVIEW from site/dist/data.json after every build, renders it with headless
  Chrome and writes site/dist/board-preview.png. site/board-preview.png is the
  fallback when rendering fails. Run locally: npm run build && npm run preview
-->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans:wght@600;700&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:"IBM Plex Sans",sans-serif;display:flex;align-items:center;color:#12224F;
  background:radial-gradient(circle at 76% 50%,#F3F6FF 0,#DCE5FB 50%,#C7D4F4 100%)}
.l{flex:1;padding:0 0 0 72px}
h1{font-size:128px;line-height:.98;font-weight:700;margin:0 0 30px;letter-spacing:-.025em}
p{font-size:44px;line-height:1.2;font-weight:600;margin:0;color:#2349BF}
.r{width:560px;height:630px;position:relative}
.logo{position:absolute;width:84px;height:84px;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:30px;color:#5530B0}
.logo img{width:78px;height:78px;object-fit:contain;border-radius:16px}
</style></head>
<body>
<div class="l"><h1>Interop<br>Board</h1><p>Which apps work<br>together</p></div>
<div class="r" id="r"><svg id="net" width="560" height="630" viewBox="0 0 560 630" style="position:absolute;left:0;top:0"></svg></div>
<script>
const LINE = '#2349BF';
// Filled in by scripts/link-preview.mjs: projects as [slug, logo] in ring order, pairs that ran
const PREVIEW = window.PREVIEW || { projects: [], played: [] };
const PROJECTS = PREVIEW.projects;
const PLAYED = PREVIEW.played;
const n = PROJECTS.length, cx = 270, cy = 315, R = 215;
const pos = PROJECTS.map((_, i) => { const a = -Math.PI / 2 + 2 * Math.PI * i / n; return [cx + R * Math.cos(a), cy + R * Math.sin(a)]; });
const idx = Object.fromEntries(PROJECTS.map((p, i) => [p[0], i]));
let s = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${LINE}" stroke-opacity="0.12" stroke-width="3"/>`;
for (const [a, b] of PLAYED) {
  const P0 = pos[idx[a]], P1 = pos[idx[b]]; const dx = P1[0] - P0[0], dy = P1[1] - P0[1], L = Math.hypot(dx, dy), g = 52 / L;
  s += `<line x1="${P0[0] + dx * g}" y1="${P0[1] + dy * g}" x2="${P1[0] - dx * g}" y2="${P1[1] - dy * g}" stroke="${LINE}" stroke-width="5" stroke-linecap="round" opacity="0.35"/>`;
}
document.getElementById('net').innerHTML = s;
const r = document.getElementById('r');
PROJECTS.forEach(([slug, src], i) => {
  const d = document.createElement('div'); d.className = 'logo';
  d.style.left = pos[i][0] + 'px'; d.style.top = pos[i][1] + 'px';
  // A logo that does not load falls back to initials, like a project without one
  const initials = slug.slice(0, 2).toUpperCase();
  d.innerHTML = src ? `<img src="${src}" alt="${slug}" onerror="this.parentNode.textContent='${initials}'">` : initials;
  r.appendChild(d);
});
</script>
</body></html>
